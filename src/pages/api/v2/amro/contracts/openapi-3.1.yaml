components:
  schemas:
    ApiEnvelope:
      type: object
      required: [version, compatMode, mode, coexistence, endpointRollout, correlationId]
      properties:
        version:
          type: string
          const: v2
        compatMode:
          type: string
        mode:
          type: string
          enum: [dual-run, module, legacy-fallback]
        coexistence:
          $ref: '#/components/schemas/CoexistenceEnvelope'
        endpointRollout:
          $ref: '#/components/schemas/RolloutState'
        correlationId:
          type: string
    CoexistenceEnvelope:
      type: object
      required: [dualRead, dualWrite]
      properties:
        dualRead:
          type: object
          required: [deterministicComparisonHash, replayCheckpoint, reconciliation]
          properties:
            deterministicComparisonHash:
              type: string
            replayCheckpoint:
              type: string
            reconciliation:
              $ref: '#/components/schemas/Reconciliation'
        dualWrite:
          type: object
          required: [enabled, approvedEntityCount, operations]
          properties:
            enabled:
              type: boolean
            approvedEntityCount:
              type: integer
            operations:
              type: array
              items:
                $ref: '#/components/schemas/DualWriteOperation'
    RolloutState:
      type: object
      required: [enabled, canaryEnforced, tenantInCanary, franchiseInCanary, capabilityInCanary, capability]
      properties:
        enabled:
          type: boolean
        canaryEnforced:
          type: boolean
        tenantInCanary:
          type: boolean
        franchiseInCanary:
          type: boolean
        capabilityInCanary:
          type: boolean
        capability:
          type: string
          enum:
            [
              work-packages,
              tasks,
              compliance-gates,
              certification,
              integration-hub,
              forecast-reliability,
            ]
    Reconciliation:
      type: object
      required: [legacyCount, moduleCount, deltaCount, missingInModule, missingInLegacy]
      properties:
        legacyCount:
          type: integer
        moduleCount:
          type: integer
        deltaCount:
          type: integer
        missingInModule:
          type: array
          items:
            type: string
        missingInLegacy:
          type: array
          items:
            type: string
    DualWriteOperation:
      type: object
      required: [entityId, eventType, idempotencyKey, queueMode]
      properties:
        entityId:
          type: string
        eventType:
          type: string
          enum: [amro.work_package.created.v1, amro.task.completed.v1, amro.compliance.gate_decided.v1]
        idempotencyKey:
          type: string
        queueMode:
          type: string
          enum: [redis, memory, disabled]
    WorkPackage:
      type: object
      required: [id, code, title, status, tenantId, domainId, version]
      properties:
        id:
          type: string
        code:
          type: string
        title:
          type: string
        status:
          type: string
          enum: [planned, in_progress, completed]
        tenantId:
          type: string
        franchiseId:
          type: [string, 'null']
        domainId:
          type: string
          const: amro
        version:
          type: string
          const: v2
    Task:
      type: object
      required: [id, workPackageId, taskCode, title, status, certifierAuthorityLevel, tenantId, domainId, version]
      properties:
        id:
          type: string
        workPackageId:
          type: string
        taskCode:
          type: string
        title:
          type: string
        status:
          type: string
          enum: [planned, in_progress, completed]
        certifierAuthorityLevel:
          type: string
          enum: [A, B, C]
        tenantId:
          type: string
        franchiseId:
          type: [string, 'null']
        domainId:
          type: string
          const: amro
        version:
          type: string
          const: v2
    ComplianceGate:
      type: object
      required: [gateId, workPackageId, taskCode, decision, tenantId, domainId, version]
      properties:
        gateId:
          type: string
        workPackageId:
          type: string
        taskCode:
          type: string
        decision:
          type: string
          enum: [approved, rejected, pending]
        decidedBy:
          type: [string, 'null']
        decidedAt:
          type: [string, 'null']
          format: date-time
        tenantId:
          type: string
        franchiseId:
          type: [string, 'null']
        domainId:
          type: string
          const: amro
        version:
          type: string
          const: v2
    WorkPackagesResponse:
      allOf:
        - $ref: '#/components/schemas/ApiEnvelope'
        - type: object
          required: [data]
          properties:
            data:
              type: object
              required: [workPackages]
              properties:
                workPackages:
                  type: array
                  items:
                    $ref: '#/components/schemas/WorkPackage'
    TasksResponse:
      allOf:
        - $ref: '#/components/schemas/ApiEnvelope'
        - type: object
          required: [data]
          properties:
            data:
              type: object
              required: [tasks]
              properties:
                tasks:
                  type: array
                  items:
                    $ref: '#/components/schemas/Task'
    ComplianceGatesResponse:
      allOf:
        - $ref: '#/components/schemas/ApiEnvelope'
        - type: object
          required: [data]
          properties:
            data:
              type: object
              required: [complianceGates]
              properties:
                complianceGates:
                  type: array
                  items:
                    $ref: '#/components/schemas/ComplianceGate'
    OverviewKpiResponse:
      type: object
      required: [version, interface, correlationId]
      properties:
        version:
          type: string
          const: v2
        interface:
          type: string
          enum: [load-kpi-dashboard, load-operational-trends, export-kpi-snapshot]
        correlationId:
          type: string
        output:
          type: object
          additionalProperties: true
    AircraftDashboardResponse:
      type: object
      required: [version, interface, correlationId, output]
      properties:
        version:
          type: string
          const: v2
        interface:
          type: string
          const: load-aircraft-lead-dashboard
        correlationId:
          type: string
        compatMode:
          type: string
        output:
          type: object
          required: [metadata]
          properties:
            metadata:
              type: object
              additionalProperties: true
            filters:
              type: object
              additionalProperties: true
            engine_module:
              oneOf:
                - $ref: '#/components/schemas/AircraftDashboardEngineModule'
                - type: 'null'
            components_module:
              oneOf:
                - type: object
                  additionalProperties: true
                - type: 'null'
            alerts:
              type: array
              items:
                type: object
                additionalProperties: true
          additionalProperties: true
    AircraftDashboardEngineModule:
      type: object
      properties:
        kpis:
          type: object
          additionalProperties:
            oneOf:
              - type: number
              - type: string
        statuses:
          type: object
          additionalProperties:
            type: string
        lifecycle_management:
          type: array
          items:
            $ref: '#/components/schemas/AircraftDashboardEngineLifecycleRow'
        maintenance_schedule:
          type: array
          items:
            type: object
            additionalProperties: true
        maintenance_planning:
          $ref: '#/components/schemas/AircraftDashboardEngineMaintenancePlanning'
        lifecycle_traceability:
          type: array
          items:
            $ref: '#/components/schemas/AircraftDashboardEngineTraceabilityRecord'
        component_monitoring:
          $ref: '#/components/schemas/AircraftDashboardEngineComponentMonitoring'
        work_orders:
          $ref: '#/components/schemas/AircraftDashboardEngineWorkOrders'
        compliance_tracking:
          $ref: '#/components/schemas/AircraftDashboardEngineComplianceTracking'
        performance_analytics:
          $ref: '#/components/schemas/AircraftDashboardEnginePerformanceAnalytics'
        integration_capabilities:
          type: array
          items:
            type: object
            additionalProperties: true
        integration_resilience:
          type: object
          additionalProperties: true
        standards_alignment:
          type: object
          additionalProperties:
            type: string
        validation:
          type: object
          additionalProperties: true
        alerts:
          type: array
          items:
            type: object
            additionalProperties: true
      additionalProperties: true
    AircraftDashboardEngineLifecycleRow:
      type: object
      required: [aircraft_id, registration, lifecycle_stage, health_score]
      properties:
        aircraft_id:
          type: string
        registration:
          type: string
        lifecycle_stage:
          type: string
        health_score:
          type: number
        total_hours:
          type: number
        total_cycles:
          type: number
        next_event_due_in_days:
          oneOf:
            - type: integer
            - type: 'null'
      additionalProperties: true
    AircraftDashboardEngineMaintenancePlanning:
      type: object
      properties:
        predictive_candidates:
          type: array
          items:
            type: object
            additionalProperties: true
        scheduled_windows:
          type: array
          items:
            type: object
            additionalProperties: true
        conflicts:
          type: array
          items:
            type: object
            additionalProperties: true
        resolution_actions:
          type: array
          items:
            type: object
            additionalProperties: true
        resource_allocation:
          type: array
          items:
            type: object
            additionalProperties: true
      additionalProperties: true
    AircraftDashboardEngineTraceabilityRecord:
