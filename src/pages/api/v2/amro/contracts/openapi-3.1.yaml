openapi: 3.1.0
info:
  title: AMRO V2 Integration API
  version: 2.0.0
  description: AMRO Integration and Coexistence contract for work-packages, schedules, tasks, inventory, compliance, certifications, audit replay, forecast recommendations, integration-hub, overview-kpi, module-catalog, screen-inventory, phase-plan, phase-1-readiness, and migration-plan.
servers:
  - url: /
paths:
  /api/v2/amro/work-packages:
    get:
      operationId: listAmroWorkPackages
      tags: [AMRO]
      parameters:
        - in: query
          name: registryVersion
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Work packages response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkPackagesResponse'
    post:
      operationId: mutateAmroWorkPackages
      tags: [AMRO]
      parameters:
        - in: query
          name: interface
          required: true
          schema:
            type: string
            enum:
              [
                create-work-package,
                transition-work-package,
                clone-template,
                assign-maintenance-slot,
                run-replan-simulation,
                confirm-replan,
                reserve-parts,
                process-shortage-response,
                sync-supplier-eta,
                trace-rotable-llp,
                run-inventory-optimization,
                sync-supplier-asn-erp,
              ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  required: [aircraft_id, maintenance_type, planned_window, station, priority, scope_items]
                  properties:
                    aircraft_id:
                      type: string
                    maintenance_type:
                      type: string
                    planned_window:
                      type: string
                    station:
                      type: string
                    priority:
                      type: string
                    scope_items:
                      type: array
                      items:
                        type: string
                - type: object
                  required: [work_package_id, target_status, reason_code, actor_signature]
                  properties:
                    work_package_id:
                      type: string
                    expected_version:
                      type: integer
                      minimum: 1
                    target_status:
                      type: string
                    reason_code:
                      type: string
                    actor_signature:
                      type: string
                - type: object
                  required: [template_id, aircraft_id, override_fields]
                  properties:
                    template_id:
                      type: string
                    registry_version:
                      type: string
                    aircraft_id:
                      type: string
                    override_fields:
                      type: object
                      additionalProperties: true
                - type: object
                  required: [work_package_id, station_code, slot_start, slot_end, assigned_team]
                  properties:
                    work_package_id:
                      type: string
                    station_code:
                      type: string
                    slot_start:
                      type: string
                    slot_end:
                      type: string
                    assigned_team:
                      type: array
                      items:
                        type: object
                        additionalProperties: true
                - type: object
                  required: [disrupted_slots, priority_rules, planning_horizon]
                  properties:
                    disrupted_slots:
                      type: array
                      items:
                        type: object
                        additionalProperties: true
                    priority_rules:
                      type: object
                      additionalProperties: true
                    planning_horizon:
                      type: string
                - type: object
                  required: [selected_option_id, approver_id, reason]
                  properties:
                    selected_option_id:
                      type: string
                    approver_id:
                      type: string
                    reason:
                      type: string
                - type: object
                  required: [work_package_id, demand_lines]
                  properties:
                    work_package_id:
                      type: string
                    demand_lines:
                      type: array
                      items:
                        type: object
                        required: [part_number, quantity]
                        properties:
                          part_number:
                            type: string
                          quantity:
                            type: number
                          serial:
                            type: string
                - type: object
                  required: [shortage_id, action, supplier_ref]
                  properties:
                    shortage_id:
                      type: string
                    action:
                      type: string
                      enum: [backorder, substitute, escalate]
                    supplier_ref:
                      type: string
                - type: object
                  required: [supplier_event_id, part_number, eta, quantity_confirmed]
                  properties:
                    supplier_event_id:
                      type: string
                    part_number:
                      type: string
                    eta:
                      type: string
                    quantity_confirmed:
                      type: number
                - type: object
                  required: [component_id, part_number, serial_number, rotable_status, llp_remaining_cycles, traceability_action]
                  properties:
                    component_id:
                      type: string
                    part_number:
                      type: string
                    serial_number:
                      type: string
                    rotable_status:
                      type: string
                      enum: [serviceable, unserviceable, quarantined]
                    llp_remaining_cycles:
                      type: number
                    traceability_action:
                      type: string
                      enum: [verify, quarantine, release]
                - type: object
                  required: [work_package_id, forecast_signal_ids, optimization_window]
                  properties:
                    work_package_id:
                      type: string
                    forecast_signal_ids:
                      type: array
                      items:
                        type: string
                    optimization_window:
                      type: string
                - type: object
                  required: [asn_event_id, procurement_source, po_number, line_items]
                  properties:
                    asn_event_id:
                      type: string
                    procurement_source:
                      type: string
                    po_number:
                      type: string
                    line_items:
                      type: array
                      items:
                        type: object
                        additionalProperties: true
                    impacted_work_packages:
                      type: array
                      items:
                        type: string
      responses:
        '200':
          description: Work package mutation response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkPackageMutationResponse'
  /api/v2/amro/templates:
    get:
      operationId: listAmroTemplates
      tags: [AMRO]
      parameters:
        - in: query
          name: registryVersion
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Template registry list response
          content:
            application/json:
              schema:
                type: object
                required: [version, source, registryVersion, templates]
                properties:
                  version:
                    type: string
                    const: v2
                  source:
                    type: string
                    const: template-registry
                  registryVersion:
                    type: string
                  templates:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
  /api/v2/amro/work-packages/{id}:
    get:
      operationId: getAmroWorkPackageDetail
      tags: [AMRO]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Work package detail response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkPackageDetailResponse'
    patch:
      operationId: patchAmroWorkPackage
      tags: [AMRO]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Work package update response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkPackageUpdateResponse'
  /api/v2/amro/work-packages/{id}/transitions:
    post:
      operationId: transitionAmroWorkPackage
      tags: [AMRO]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target_status, reason_code, actor_signature]
              properties:
                current_status:
                  type: string
                target_status:
                  type: string
                reason_code:
                  type: string
                actor_signature:
                  type: string
      responses:
        '200':
          description: Work package transition response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkPackageTransitionResponse'
  /api/v2/amro/ops/health/persistence:
    get:
      operationId: amroOpsPersistenceHealth
      tags: [AMRO]
      responses:
        '200':
          description: Persistence connectivity is healthy
          content:
            application/json:
              schema:
                type: object
                required: [version, status, schema, elapsed_ms, threshold_ms]
                properties:
                  version:
                    type: string
                    const: v2
                  status:
                    type: string
                    enum: [ok, degraded]
                  schema:
                    type: string
                    const: amro_ops
                  elapsed_ms:
                    type: number
                  threshold_ms:
                    type: number
  /api/v2/amro/audits/workflow/{transitionId}:
    get:
      operationId: getAmroWorkflowAudit
      tags: [AMRO]
      parameters:
        - in: path
          name: transitionId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Workflow transaction log entry
          content:
            application/json:
              schema:
                type: object
                required: [version, transition_id, elapsed_ms, p99_target_ms, log]
                properties:
                  version:
                    type: string
                    const: v2
                  transition_id:
                    type: string
                  elapsed_ms:
                    type: number
                  p99_target_ms:
                    type: number
                  log:
                    type: object
                    additionalProperties: true
  /api/v2/amro/schedules:
    get:
      operationId: listAmroSchedules
      tags: [AMRO]
      parameters:
        - in: query
          name: station
          required: false
          schema:
            type: string
        - in: query
          name: date
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Scheduling board response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
    post:
      operationId: mutateAmroSchedules
      tags: [AMRO]
      parameters:
        - in: query
          name: interface
          required: true
          schema:
            type: string
            enum: [assign-maintenance-slot, acknowledge-schedule-update]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  required: [work_package_id, station_code, slot_start, slot_end, assigned_team]
                  properties:
                    work_package_id:
                      type: string
                    station_code:
                      type: string
                    slot_start:
                      type: string
                    slot_end:
                      type: string
                    station_capacity:
                      type: number
                    existing_slots:
                      type: array
                      items:
                        type: object
                        additionalProperties: true
                    assigned_team:
                      type: array
                      items:
                        type: object
                        additionalProperties: true
                - type: object
                  required: [schedule_id, work_package_id, acknowledged_at, device_id]
                  properties:
                    schedule_id:
                      type: string
                    work_package_id:
                      type: string
                    acknowledged_at:
                      type: string
                    device_id:
                      type: string
                    note:
                      type: string
      responses:
        '200':
          description: Scheduling mutation response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /api/v2/amro/schedules/replan:
    post:
      operationId: replanAmroSchedules
      tags: [AMRO]
      parameters:
        - in: query
          name: interface
          required: true
          schema:
            type: string
            enum: [run-replan-simulation, confirm-replan, generate-schedule-optimization-recommendations]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  required: [disrupted_slots, priority_rules, planning_horizon, active_constraints, tenant_calendar_id]
                  properties:
                    disrupted_slots:
                      type: array
                      items:
                        type: object
                        additionalProperties: true
                    priority_rules:
                      type: object
                      additionalProperties: true
                    planning_horizon:
                      type: string
                    active_constraints:
                      type: array
                      items:
                        type: object
                        additionalProperties: true
                    tenant_calendar_id:
                      type: string
                - type: object
                  required: [selected_option_id, approver_id, reason, affected_work_packages]
                  properties:
                    selected_option_id:
                      type: string
                    approver_id:
                      type: string
                    reason:
                      type: string
                    affected_work_packages:
                      type: array
                      items:
                        type: object
                        additionalProperties: true
                - type: object
                  required: [schedule_date, station_code]
                  properties:
                    schedule_date:
                      type: string
                    station_code:
                      type: string
                    demand_pressure:
                      type: number
                    disruption_risk:
                      type: number
                    recommendation_count:
                      type: number
      responses:
        '200':
          description: Scheduling replan response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /api/v2/amro/tasks:
    get:
      operationId: listAmroTasks
      tags: [AMRO]
      parameters:
        - in: query
          name: workPackageId
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Tasks response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TasksResponse'
    post:
      operationId: mutateAmroTasks
      tags: [AMRO]
      parameters:
        - in: query
          name: interface
          required: true
          schema:
            type: string
            enum: [update-task-step, upload-evidence, submit-signature, save-offline-task-action, sync-offline-queue]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  required: [task_id, step_id, action, performed_at, device_id]
                  properties:
                    task_id:
                      type: string
                    step_id:
                      type: string
                    action:
                      type: string
                    performed_at:
                      type: string
                    device_id:
                      type: string
                - type: object
                  required: [task_id, evidence_type, media_ref, checksum, metadata]
                  properties:
                    task_id:
                      type: string
                    evidence_type:
                      type: string
                    media_ref:
                      type: string
                    checksum:
                      type: string
                    metadata:
                      type: object
                      additionalProperties: true
                - type: object
                  required: [task_id, signer_id, method, signature_payload]
                  properties:
                    task_id:
                      type: string
                    signer_id:
                      type: string
                    method:
                      type: string
                    signature_payload:
                      type: string
                - type: object
                  required: [task_id, step_id, action, expected_step_index, actual_step_index]
                  properties:
                    task_id:
                      type: string
                    step_id:
                      type: string
                    action:
                      type: string
                    expected_step_index:
                      type: integer
                    actual_step_index:
                      type: integer
                    local_revision:
                      type: integer
                    queued_at:
                      type: string
                - type: object
                  required: [queue_entries]
                  properties:
                    queue_entries:
                      type: array
                      items:
                        type: object
                        additionalProperties: true
      responses:
        '200':
          description: Task execution mutation response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskExecutionMutationResponse'
  /api/v2/amro/tasks/{id}/evidence:
    post:
      operationId: uploadAmroTaskEvidenceById
      tags: [AMRO]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [evidence_type, media_ref, checksum, metadata]
              properties:
                evidence_type:
                  type: string
                media_ref:
                  type: string
                checksum:
                  type: string
                metadata:
                  type: object
                  additionalProperties: true
      responses:
        '200':
          description: Evidence upload response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskExecutionMutationResponse'
  /api/v2/amro/inventory/reservations:
    post:
      operationId: reserveAmroInventory
      tags: [AMRO]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [work_package_id, line_items]
              properties:
                work_package_id:
                  type: string
                line_items:
                  type: array
                  items:
                    type: object
                    additionalProperties: true
      responses:
        '200':
          description: Inventory reservation response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
    delete:
      operationId: releaseAmroInventoryReservation
      tags: [AMRO]
      parameters:
        - in: query
          name: reservation_id
          required: false
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Inventory reservation release response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /api/v2/amro/inventory/availability:
    get:
      operationId: getAmroInventoryAvailability
      tags: [AMRO]
      parameters:
        - in: query
          name: station_code
          required: false
          schema:
            type: string
        - in: query
          name: part_numbers
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Inventory availability response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /api/v2/amro/compliance/obligations:
    get:
      operationId: listAmroComplianceObligations
      tags: [AMRO]
      parameters:
        - in: query
          name: work_package_id
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Compliance obligations list response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
    post:
      operationId: ingestAmroComplianceObligations
      tags: [AMRO]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [source, obligations]
              properties:
                source:
                  type: string
                feed_batch_id:
                  type: string
                obligations:
                  type: array
                  items:
                    type: object
                    additionalProperties: true
      responses:
        '200':
          description: Compliance obligations ingest response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /api/v2/amro/compliance/gates/evaluate:
    post:
      operationId: evaluateAmroComplianceGate
      tags: [AMRO]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Compliance gate evaluation response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComplianceMutationResponse'
  /api/v2/amro/certifications/validate:
    post:
      operationId: validateAmroCertificationAuthority
      tags: [AMRO]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Certification validation response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CertificationMutationResponse'
  /api/v2/amro/certifications/actions:
    post:
      operationId: actionAmroCertification
      tags: [AMRO]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Certification action response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CertificationMutationResponse'
  /api/v2/amro/audit/replay:
    get:
      operationId: replayAmroAudit
      tags: [AMRO]
      parameters:
        - in: query
          name: capability
          required: false
          schema:
            type: string
        - in: query
          name: limit
          required: false
          schema:
            type: integer
      responses:
        '200':
          description: Audit replay response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /api/v2/amro/forecast/recommendations:
    get:
      operationId: getAmroForecastRecommendations
      tags: [AMRO]
      parameters:
        - in: query
          name: work_package_id
          required: false
          schema:
            type: string
        - in: query
          name: planning_horizon_days
          required: false
          schema:
            type: integer
      responses:
        '200':
          description: Forecast recommendation response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForecastReliabilityMutationResponse'
  /api/v2/amro/compliance-gates:
    get:
      operationId: listAmroComplianceGates
      tags: [AMRO]
      parameters:
        - in: query
          name: decision
          required: false
          schema:
            type: string
            enum: [approved, rejected, pending]
      responses:
        '200':
          description: Compliance gates response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComplianceGatesResponse'
    post:
      operationId: mutateAmroComplianceGates
      tags: [AMRO]
      parameters:
        - in: query
          name: interface
          required: true
          schema:
            type: string
            enum:
              [
                evaluate-compliance-gate,
                pre-schedule-compliance-gate,
                pre-execution-compliance-gate,
                evaluate-closure-quality-gate,
                post-release-audit-gate,
                register-exception-request,
                generate-compliance-dossier,
                ingest-ad-sb-obligations,
                evaluate-mel-cdl-deferral,
                load-compliance-gate-explainability,
                load-audit-replay-timeline,
                detect-compliance-anomalies,
                load-regulator-profile-pack,
              ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  required: [context, regulator_profile, required_obligations]
                  properties:
                    context:
                      type: object
                      required: [type, id]
                      properties:
                        type:
                          type: string
                          enum: [work_package, task]
                        id:
                          type: string
                    regulator_profile:
                      type: string
                      enum: [FAA, EASA, CAAC, faa, easa, caac]
                    required_obligations:
                      type: array
                      items:
                        type: object
                        additionalProperties: true
                - type: object
                  required: [work_package_id, obligation_id, justification, requested_by]
                  properties:
                    work_package_id:
                      type: string
                    obligation_id:
                      type: string
                    justification:
                      type: string
                    requested_by:
                      type: string
                - type: object
                  required: [work_package_id, profile, include_artifacts]
                  properties:
                    work_package_id:
                      type: string
                    profile:
                      type: string
                      enum: [FAA, EASA, CAAC, faa, easa, caac]
                    include_artifacts:
                      type: array
                      items:
                        type: string
                - type: object
                  required: [work_package_id, aircraft_status]
                  properties:
                    work_package_id:
                      type: string
                    aircraft_status:
                      type: string
                    unresolved_mandatory_obligations:
                      type: array
                      items:
                        type: string
                - type: object
                  required: [task_id, technician_id, technician_competency_valid, certification_valid]
                  properties:
                    task_id:
                      type: string
                    technician_id:
                      type: string
                    technician_competency_valid:
                      type: boolean
                    certification_valid:
                      type: boolean
                - type: object
                  required: [work_package_id, open_findings, unresolved_deferrals, pending_signatures, evidence_coverage_pct]
                  properties:
                    work_package_id:
                      type: string
                    open_findings:
                      type: integer
                    unresolved_deferrals:
                      type: integer
                    pending_signatures:
                      type: integer
                    evidence_coverage_pct:
                      type: number
                - type: object
                  required: [work_package_id, release_decision_id, evidence_link_hash]
                  properties:
                    work_package_id:
                      type: string
                    release_decision_id:
                      type: string
                    evidence_link_hash:
                      type: string
      responses:
        '200':
          description: Compliance mutation response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComplianceMutationResponse'
  /api/v2/amro/certification:
    post:
      operationId: mutateAmroCertification
      tags: [AMRO]
      parameters:
        - in: query
          name: interface
          required: true
          schema:
            type: string
            enum:
              [
                validate-certifying-authority,
                submit-certification-decision,
                escalate-blocked-certification,
                automate-expiry-suspension,
