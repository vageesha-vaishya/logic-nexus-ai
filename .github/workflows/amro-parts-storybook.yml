name: amro-parts-storybook

on:
  pull_request:
    paths:
      - 'src/features/module-amro/components/**'
      - '.github/workflows/amro-parts-storybook.yml'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

jobs:
  validate-amro-parts-library:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run focused AMRO parts tests
        run: |
          npm run test -- \
            src/features/module-amro/components/templates/AmroInventoryDataGridTemplate.test.tsx \
            src/features/module-amro/components/parts/AmroPartsInventoryWorkbench.test.tsx \
            src/features/module-amro/components/parts/usePartsCatalogState.test.tsx

      - name: Build Storybook
        run: npm run build-storybook

      - name: Run Cypress permission flow against Storybook
        run: |
          npm run storybook -- --port 6007 --ci --no-open > /tmp/storybook-ci.log 2>&1 &
          SB_PID=$!
          for i in {1..60}; do
            if curl -sSf http://localhost:6007 >/dev/null; then
              break
            fi
            sleep 2
          done
          npx cypress@13.15.2 run --spec cypress/integration/amro-grid-permissions.cy.js
          kill $SB_PID
