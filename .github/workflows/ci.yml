name: CI - Quality Checks

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  quality-check:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Secret scan (Gitleaks)
      uses: gitleaks/gitleaks-action@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
      with:
        config-path: .gitleaks.toml

    - name: Enforce new-table governance
      run: |
        set -euo pipefail

        if [ "${{ github.event_name }}" = "pull_request" ]; then
          BASE_REF="origin/${{ github.base_ref }}"
          git fetch origin "${{ github.base_ref }}" --depth=1
        else
          BASE_REF="HEAD~1"
        fi

        CHANGED_MIGRATIONS=$(git diff --name-only "$BASE_REF"...HEAD -- 'supabase/migrations/*.sql' || true)
        if [ -z "$CHANGED_MIGRATIONS" ]; then
          echo "No migration changes detected."
          exit 0
        fi

        VIOLATIONS=0
        for FILE in $CHANGED_MIGRATIONS; do
          if git diff "$BASE_REF"...HEAD -- "$FILE" | grep -Eiq '^\+.*create table( if not exists)? '; then
            if ! grep -Eq '^-- DB-VERIFICATION:\s+\S+' "$FILE"; then
              echo "Missing DB-VERIFICATION metadata in $FILE"
              VIOLATIONS=1
            fi
            if ! grep -Eq '^-- DB-ARCH-APPROVAL:\s+\S+' "$FILE"; then
              echo "Missing DB-ARCH-APPROVAL metadata in $FILE"
              VIOLATIONS=1
            fi
          fi
        done

        if [ "$VIOLATIONS" -ne 0 ]; then
          echo "New-table migration governance check failed."
          exit 1
        fi

        echo "New-table migration governance check passed."

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Install PostgreSQL client
      run: sudo apt-get update && sudo apt-get install -y postgresql-client

    - name: Linting
      run: npm run lint

    - name: Type Checking
      run: npm run typecheck

    - name: Unit Tests
      run: npm run test

    - name: UIM GraphQL Contract Snapshot
      run: npm run test:uim:graphql:contract

    - name: Seed Integrity Check (QUO-260309-00001)
      env:
        SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      run: |
        test -n "$SUPABASE_DB_URL" || (echo "Missing required secret: SUPABASE_DB_URL" && exit 1)
        npm run seed:verify:quo260309

    - name: Build Test
      run: npm run build

    - name: Bundle size budget (T23 perf gate)
      run: npm run bundle:check
