openapi: 3.1.0
info:
  title: LLM Gateway
  version: 0.3.5
  description: |
    Unified LLM gateway for the multi-platform SaaS estate. As of v0.3.5,
    every layer described in the design doc is wired:
      - 6 chat providers (echo, replay, anthropic, openai, google_gemini, mistral)
        + 2 embedding providers (echo, openai)
      - 6-layer cascade resolution with pin + capability + egress validation
      - Service-token auth with 8 scopes
      - PII redaction with strict/moderate/pass_through/custom policies
      - Prompt management (versioned bodies + variants + A/B experiments)
      - Outcome capture + chi-square auto-promote
      - Hierarchical budget caps + quota caps (platform/tenant/feature/franchisee)
      - Append-only audit log on every invocation
      - GDPR right-to-be-forgotten
      - W3C traceparent propagation
      - Tool use / function calling

    Canonical design: docs/plans/2026-06-02-unified-llm-gateway-design.md
  contact:
    name: Platform team
servers:
  - url: http://localhost:3020
    description: Local dev
  - url: https://llm-gateway.sosservices.online
    description: Production

# ─── Paths ──────────────────────────────────────────────────────────
paths:
  /healthz:
    get:
      summary: Liveness probe
      description: Always 200 when the process is up. Includes provider registry snapshot.
      responses:
        '200':
          description: Healthy
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthResponse' }

  /readyz:
    get:
      summary: Readiness probe
      description: 200 when external dependencies are reachable.
      responses:
        '200':
          description: Ready
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, enum: [ready, not_ready] }

  # ───── Invoke ─────
  /v1/invoke:
    post:
      summary: Synchronous LLM invocation
      description: |
        Full pipeline: auth → PII redact → 6-layer cascade resolve →
        budget+quota enforcement → prompt render + A/B variant pick →
        provider call (with optional tools) → unredact response →
        audit log write → counter increment.
      security: [{ BearerServiceToken: [] }]
      parameters:
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/XPlatformId'
        - $ref: '#/components/parameters/XTenantId'
        - $ref: '#/components/parameters/Traceparent'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InvokeRequest' }
      responses:
        '200':
          description: Success
          headers:
            X-Correlation-Id:
              schema: { type: string, format: uuid }
            X-Trace-Id:
              schema: { type: string, pattern: '^[0-9a-f]{32}$' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvokeResponse' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/RateLimitedOrBudget' }
        '503': { $ref: '#/components/responses/ProviderUnavailable' }

  # ───── Embeddings ─────
  /v1/embed:
    post:
      summary: Embed text inputs into vectors
      description: Caller stores the resulting vectors; gateway is stateless for embeddings.
      security: [{ BearerServiceToken: [] }]
      parameters:
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmbedRequest' }
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmbedResponse' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ───── Outcomes ─────
  /v1/outcomes:
    post:
      summary: Record the downstream outcome of an invocation
      description: |
        Caller records whether the LLM result was accepted/rejected/etc.
        Gateway joins to gateway.llm_invocations to recover experiment context
        and writes one row to gateway.outcomes (append-only).
      security: [{ BearerServiceToken: [] }]
      parameters:
        - $ref: '#/components/parameters/Authorization'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [invocation_id, outcome]
              properties:
                invocation_id: { type: string, format: uuid }
                outcome: { $ref: '#/components/schemas/Outcome' }
      responses:
        '201':
          description: Recorded
          content:
            application/json:
              schema:
                type: object
                required: [outcome_id, invocation_id, kind]
                properties:
                  outcome_id: { type: string }
                  invocation_id: { type: string, format: uuid }
                  kind: { $ref: '#/components/schemas/OutcomeKind' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ───── Prompts ─────
  /v1/prompts/{key}:
    get:
      summary: Fetch the active version of a registered prompt
      security: [{ BearerServiceToken: [] }]
      parameters:
        - $ref: '#/components/parameters/Authorization'
        - in: path
          name: key
          required: true
          schema: { type: string }
          description: Canonical prompt key (e.g. compliance.screening.hit_reasoning)
      responses:
        '200':
          description: Active version
          content:
            application/json:
              schema:
                type: object
                required: [prompt, active_version]
                properties:
                  prompt: { $ref: '#/components/schemas/Prompt' }
                  active_version: { $ref: '#/components/schemas/PromptVersion' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/prompts/{key}/render:
    post:
      summary: Render a prompt with variables, NO LLM call
      description: Dev tool. Useful for previewing template substitution before /v1/invoke.
      security: [{ BearerServiceToken: [] }]
      parameters:
        - $ref: '#/components/parameters/Authorization'
        - in: path
          name: key
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [variables]
              properties:
                variables:
                  type: object
                  additionalProperties: true
                provider_kind: { $ref: '#/components/schemas/ProviderKind' }
      responses:
        '200':
          description: Rendered
          content:
            application/json:
              schema:
                type: object
                required: [prompt_key, version_id, version_number, rendered, missing_paths, applied_paths]
                properties:
                  prompt_key: { type: string }
                  version_id: { type: string }
                  version_number: { type: integer }
                  rendered: { type: string }
                  missing_paths:
                    type: array
                    items: { type: string }
                  applied_paths:
                    type: array
                    items: { type: string }
                  provider_kind: { $ref: '#/components/schemas/ProviderKind' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/admin/prompts:
    get:
      summary: List seeded prompts (operator view)
      description: |
        Returns one row per prompt key plus a count of all versions on that
        key. Requires `admin_configs` scope. When the gateway has no
        Supabase env configured, returns `{ items: [], note: ... }`.
      security: [{ BearerServiceToken: [] }]
      parameters:
        - $ref: '#/components/parameters/Authorization'
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
      responses:
        '200':
          description: Prompt list
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminPromptListResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      summary: Create or bump a prompt version
      description: |
        Requires `admin_prompts` scope. Idempotent on (key, body): each call
        creates a new version row; promote_active=true (default) flips
        gateway.prompts.active_version_id.
      security: [{ BearerServiceToken: [] }]
      parameters:
        - $ref: '#/components/parameters/Authorization'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PromptUpsertInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                required: [version_id, version_number]
                properties:
                  version_id: { type: string }
                  version_number: { type: integer }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v1/admin/experiments:
    get:
      summary: List A/B prompt experiments (operator view)
      description: |
        Returns experiments oldest-active-first with verdict + sample_size
        when available. Requires `admin_configs` scope.
      security: [{ BearerServiceToken: [] }]
      parameters:
        - $ref: '#/components/parameters/Authorization'
        - in: query
          name: status
          schema: { type: string, enum: [active, evaluated, promoted, cancelled] }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
      responses:
        '200':
          description: Experiment list
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminExperimentListResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v1/admin/audit:
    get:
      summary: List recent invocation audit rows (operator view)
      description: |
        Returns the most recent invocation audit rows ordered by ts desc.
        Filterable by prompt_key, status, tenant_id. Requires `admin_configs`
        scope. PII columns the caller does not own are scrubbed at the
        DB layer regardless of this endpoint.
      security: [{ BearerServiceToken: [] }]
      parameters:
        - $ref: '#/components/parameters/Authorization'
        - in: query
          name: prompt_key
          schema: { type: string }
        - in: query
          name: status
          schema: { type: string, enum: [succeeded, failed, rejected_safety] }
        - in: query
          name: tenant_id
          schema: { type: string, format: uuid }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        '200':
          description: Audit row list
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminAuditListResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ───── Experiments (A/B + auto-promote) ─────
  /v1/admin/experiments/{id}/evaluate:
    post:
      summary: Evaluate an A/B experiment (read-only)
      description: |
        Returns the 2×2 contingency table from gateway.evaluate_experiment +
        the chi-square verdict. Does NOT mutate state.
      security: [{ BearerServiceToken: [] }]
      parameters:
        - $ref: '#/components/parameters/Authorization'
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EvalOptions' }
      responses:
        '200':
          description: Verdict
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EvalResponse' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/admin/experiments/{id}/auto-promote:
    post:
      summary: Evaluate + promote winner if verdict is significant
      description: |
        Atomic: if verdict.kind=='significant', flips active_version_id
        and marks the experiment 'completed'. Otherwise 202 with reason.
      security: [{ BearerServiceToken: [] }]
      parameters:
        - $ref: '#/components/parameters/Authorization'
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EvalOptions' }
      responses:
        '200':
          description: Promoted
          content:
            application/json:
              schema:
                type: object
                properties:
                  experiment_id: { type: string }
                  promoted: { type: boolean, enum: [true] }
                  winner_version_id: { type: string }
                  loser_version_id: { type: string }
                  prior_active_version_id: { type: string, nullable: true }
                  verdict: { $ref: '#/components/schemas/EvalVerdict' }
        '202':
          description: Not promoted (verdict not significant)
          content:
            application/json:
              schema:
                type: object
                properties:
                  experiment_id: { type: string }
                  promoted: { type: boolean, enum: [false] }
                  reason: { type: string }
                  verdict: { $ref: '#/components/schemas/EvalVerdict' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  # ───── GDPR right-to-be-forgotten ─────
  /v1/admin/right-to-be-forgotten:
    post:
      summary: Scrub PII columns for a subject
      description: |
        Per design §9.5. NULLs identifying columns on gateway.llm_invocations +
        gateway.outcomes for the given subject. Preserves metadata for audit
        integrity. Idempotent. Logs every call to gateway.rtbf_log.
      security: [{ BearerServiceToken: [] }]
      parameters:
        - $ref: '#/components/parameters/Authorization'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tenant_id, subject_type, subject_id]
              properties:
                tenant_id: { type: string, format: uuid }
                subject_type:
                  type: string
                  enum: [user, party]
                  description: When 'user', subject_id must be a uuid.
                subject_id: { type: string, maxLength: 256 }
                actor_user_id: { type: string, format: uuid, nullable: true }
                reason: { type: string, nullable: true }
      responses:
        '200':
          description: Scrubbed
          content:
            application/json:
              schema:
                type: object
                properties:
                  tenant_id: { type: string }
                  subject_type: { type: string }
                  subject_id_prefix:
                    type: string
                    description: First 8 chars + '…'. Full subject_id NEVER echoed.
                  scrubbed_invocations: { type: integer }
                  scrubbed_outcomes: { type: integer }
                  rtbf_log_id: { type: string }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ───── Fine-tuning ─────
  /v1/fine-tunes:
    post:
      summary: Create a fine-tuning job
      description: |
        Persists a new gateway.fine_tune_jobs row in `queued` state. Does NOT
        submit to the provider yet — call POST /v1/fine-tunes/{id}/submit
        afterwards. Requires `submit_job` scope.

        dataset_url accepts either an OpenAI file id (file-…) or an https://
        signed URL the gateway can fetch (translated to a file id on submit).
      security: [{ BearerServiceToken: [] }]
      parameters:
        - $ref: '#/components/parameters/Authorization'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FineTuneCreateInput' }
      responses:
        '201':
          description: Job created in queued state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FineTuneJob' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v1/fine-tunes/{id}:
    get:
      summary: Fetch a fine-tuning job by id
      security: [{ BearerServiceToken: [] }]
      parameters:
        - $ref: '#/components/parameters/Authorization'
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Job row
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FineTuneJob' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/fine-tunes/{id}/submit:
    post:
      summary: Submit a queued job to the provider
      description: |
        Requires `admin_configs` scope (training quota usage). Flips status
        queued → preparing, captures the provider_job_id, and overwrites
        base_model_id with the provider's effective model id (date-suffixed).
        Idempotent: re-submitting a job past `queued` returns the current row.
      security: [{ BearerServiceToken: [] }]
      parameters:
        - $ref: '#/components/parameters/Authorization'
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                suffix: { type: string, maxLength: 18, description: Provider model id suffix (max 18 chars). }
      responses:
        '200':
          description: Submission accepted
          content:
            application/json:
              schema:
                type: object
                required: [job, provider_job_id, effective_model_id]
                properties:
                  job: { $ref: '#/components/schemas/FineTuneJob' }
                  provider_job_id: { type: string }
                  effective_model_id: { type: string }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/ProviderUnavailable' }

  /v1/fine-tunes/{id}/cancel:
    post:
      summary: Cancel a fine-tuning job
      description: |
        Idempotent. Cancelling an already-terminal job returns the current
        row unchanged. Requires `submit_job` scope.
      security: [{ BearerServiceToken: [] }]
      parameters:
        - $ref: '#/components/parameters/Authorization'
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, maxLength: 240 }
      responses:
        '200':
          description: Cancelled (or already terminal)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FineTuneJob' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/fine-tunes/poll:
    post:
      summary: Run one fine-tune status-polling tick
      description: |
        Drains non-terminal jobs that have a provider_job_id set and refreshes
        their status from the provider. Requires `admin_configs` scope. Returns
        observability counts; never throws on provider errors (captured per-job).
        Also runs automatically every LLM_GATEWAY_FT_POLL_INTERVAL_SEC seconds
        when that env var is set in the deployment.
      security: [{ BearerServiceToken: [] }]
      parameters:
        - $ref: '#/components/parameters/Authorization'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                limit: { type: integer, minimum: 1, maximum: 200, default: 25 }
      responses:
        '200':
          description: Tick result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FineTunePollTickResult' }
        '403': { $ref: '#/components/responses/Forbidden' }

# ─── Reusable components: parameters, security, responses, schemas ──
components:
  parameters:
    Authorization:
      in: header
      name: Authorization
      schema: { type: string }
      description: Bearer service-token. Required scope per endpoint.
    XPlatformId:
      in: header
      name: X-Platform-Id
      schema: { type: string }
      description: Calling platform id (e.g. `logic-nexus-ai`)
    XTenantId:
      in: header
      name: X-Tenant-Id
      schema: { type: string, format: uuid }
      description: Tenant uuid (mirror of body.tenant_id when present)
    Traceparent:
      in: header
      name: traceparent
      schema: { type: string, pattern: '^00-[0-9a-f]{32}-[0-9a-f]{16}-[0-9a-f]{2}$' }
      description: W3C Trace Context. Parsed; trace_id flows to gateway.llm_invocations.
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      schema: { type: string }
      description: ULID for 24h-TTL deduplication (P2 onward)

  securitySchemes:
    BearerServiceToken:
      type: http
      scheme: bearer
      bearerFormat: lngw_<base64url>

  responses:
    InvalidRequest:
      description: Validation error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Unauthorized:
      description: Missing or invalid auth
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Forbidden:
      description: Token lacks required scope, or X-Platform-Id mismatch
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Conflict:
      description: State conflict (e.g. experiment not in 'active' status)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Unprocessable:
      description: |
        Semantic rejection: egress forbidden, model capability mismatch,
        PII pass-through not consented.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    RateLimitedOrBudget:
      description: Budget or quota exceeded; or rate-limited
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    ProviderUnavailable:
      description: Provider not configured or 5xx
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  schemas:
    HealthResponse:
      type: object
      required: [status, service, phase, providers_available]
      properties:
        status: { type: string, enum: [ok] }
        service: { type: string, enum: [llm-gateway] }
        phase: { type: string }
        providers_available:
          type: array
          items: { $ref: '#/components/schemas/ProviderKind' }

    ProviderKind:
      type: string
      enum: [anthropic, openai, google_gemini, mistral, ollama, vllm, azure_openai, echo, replay]

    BillingMode:
      type: string
      enum: [platform_paid, tenant_paid]

    # ── Invoke ──
    InvokeRequest:
      type: object
      required: [tenant_id, module, feature, prompt_key, variables]
      properties:
        tenant_id: { type: string, format: uuid }
        module: { type: string, example: compliance }
        feature: { type: string, example: screening.hit_reasoning }
        prompt_key:
          type: string
          example: compliance.screening.hit_reasoning
        variables:
          type: object
          additionalProperties: true
        subject:
          type: object
          required: [type, id]
          properties:
            type: { type: string }
            id: { type: string }
        options: { $ref: '#/components/schemas/InvokeOptions' }
        required_capabilities:
          type: array
          items:
            type: string
            enum: [tools, vision, json_mode, streaming, embeddings, fine_tuning]
        tools:
          type: array
          items: { $ref: '#/components/schemas/ToolDef' }
        tool_choice:
          oneOf:
            - { type: string, enum: [auto, required, none] }
            - type: object
              required: [name]
              properties:
                name: { type: string }

    InvokeOptions:
      type: object
      properties:
        model_override: { type: string }
        provider_override: { $ref: '#/components/schemas/ProviderKind' }
        cache_ttl_seconds: { type: integer, minimum: 0 }
        timeout_ms: { type: integer, minimum: 100 }
        temperature: { type: number, minimum: 0, maximum: 2 }
        max_tokens: { type: integer, minimum: 1 }

    ToolDef:
      type: object
      required: [name, parameters_schema]
      properties:
        name: { type: string }
        description: { type: string }
        parameters_schema:
          type: object
          description: JSON Schema for tool arguments

    ToolCall:
      type: object
      required: [id, name, args]
      properties:
        id: { type: string }
        name: { type: string }
        args:
          type: object
          additionalProperties: true

    InvokeUsage:
      type: object
      required: [prompt_tokens, completion_tokens, total_tokens]
      properties:
        prompt_tokens: { type: integer }
        completion_tokens: { type: integer }
        total_tokens: { type: integer }

    InvokeResponse:
      type: object
      required:
        - invocation_id
        - output
        - cache_hit
        - model_used
        - provider_kind
        - usage
        - cost_usd
        - latency_ms
      properties:
        invocation_id: { type: string, format: uuid }
        output: { description: Provider-typed output }
        cache_hit: { type: boolean }
        model_used: { type: string }
        provider_kind: { $ref: '#/components/schemas/ProviderKind' }
        usage: { $ref: '#/components/schemas/InvokeUsage' }
        cost_usd: { type: number }
        latency_ms: { type: integer }
        warnings:
          type: array
          items: { type: string }
        tool_calls:
          type: array
          items: { $ref: '#/components/schemas/ToolCall' }
        scaffold_phase:
          type: string
          deprecated: true

    # ── Embed ──
    EmbedRequest:
      type: object
      required: [tenant_id, inputs]
      properties:
        tenant_id: { type: string, format: uuid }
        model: { type: string, default: text-embedding-3-small }
        inputs:
          type: array
          minItems: 1
          maxItems: 256
          items: { type: string, maxLength: 32768 }
        metadata:
          type: object
          additionalProperties: true

    EmbedResponse:
      type: object
      required: [invocation_id, model_used, provider_kind, embeddings, usage, cost_usd, latency_ms]
      properties:
        invocation_id: { type: string, format: uuid }
        model_used: { type: string }
        provider_kind: { $ref: '#/components/schemas/ProviderKind' }
        embeddings:
          type: array
          items:
            type: array
            items: { type: number }
        usage:
          type: object
          properties:
            prompt_tokens: { type: integer }
            total_tokens: { type: integer }
        cost_usd: { type: number }
        latency_ms: { type: integer }
        warnings: { type: array, items: { type: string } }

    # ── Outcomes ──
    Outcome:
      oneOf:
        - { type: object, required: [kind, user_id], properties: { kind: { const: accepted }, user_id: { type: string }, notes: { type: string } } }
        - { type: object, required: [kind, user_id, edited_output], properties: { kind: { const: accepted_after_edit }, user_id: { type: string }, edited_output: {}, notes: { type: string } } }
        - { type: object, required: [kind, user_id], properties: { kind: { const: rejected }, user_id: { type: string }, notes: { type: string } } }
        - { type: object, required: [kind, user_id, edited_output], properties: { kind: { const: overridden }, user_id: { type: string }, edited_output: {}, notes: { type: string } } }
        - { type: object, required: [kind], properties: { kind: { const: ignored }, notes: { type: string } } }

    OutcomeKind:
      type: string
      enum: [accepted, accepted_after_edit, rejected, overridden, ignored]

    # ── Prompts ──
    Prompt:
      type: object
      required: [key, module, feature, status, active_version_id, created_at, updated_at]
      properties:
        key: { type: string }
        module: { type: string }
        feature: { type: string }
        description: { type: string, nullable: true }
        status: { type: string, enum: [active, deprecated, archived] }
        active_version_id: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    PromptVersion:
      type: object
      required: [id, prompt_key, version_number, body, body_variants, frontmatter, cache_ttl_seconds, safety_class, status, source, created_at]
      properties:
        id: { type: string }
        prompt_key: { type: string }
        version_number: { type: integer }
        body: { type: string }
        body_variants:
          type: object
          additionalProperties: { type: string }
        frontmatter:
          type: object
          additionalProperties: true
        default_capability: { type: string, nullable: true }
        default_temperature: { type: number, nullable: true }
        default_max_tokens: { type: integer, nullable: true }
        cache_ttl_seconds: { type: integer }
        safety_class: { type: string, enum: [standard, elevated, restricted] }
        status: { type: string, enum: [draft, active, superseded, rolled_back] }
        source: { type: string, enum: [git, admin_ui] }
        created_at: { type: string, format: date-time }
        promoted_at: { type: string, format: date-time, nullable: true }

    PromptUpsertInput:
      type: object
      required: [key, module, feature, body]
      properties:
        key: { type: string }
        module: { type: string }
        feature: { type: string }
        body: { type: string }
        description: { type: string }
        body_variants:
          type: object
          additionalProperties: { type: string }
        frontmatter:
          type: object
          additionalProperties: true
        input_schema: { type: object, additionalProperties: true }
        output_schema: { type: object, additionalProperties: true }
        default_capability: { type: string }
        default_temperature: { type: number }
        default_max_tokens: { type: integer }
        cache_ttl_seconds: { type: integer }
        safety_class: { type: string, enum: [standard, elevated, restricted] }
        source: { type: string, enum: [git, admin_ui] }
        git_sha: { type: string }
        promote_active: { type: boolean, default: true }

    # ── Experiments ──
    EvalOptions:
      type: object
      properties:
        p_threshold:
          type: number
          minimum: 0
          maximum: 1
          default: 0.05
        min_per_variant:
          type: integer
          minimum: 0
          default: 30

    EvalVerdict:
      oneOf:
        - type: object
          required: [kind, have, need]
          properties:
            kind: { const: insufficient_invocations }
            have: { type: integer }
            need: { type: integer }
        - type: object
          required: [kind, have_a, have_b, need]
          properties:
            kind: { const: insufficient_outcomes_per_variant }
            have_a: { type: integer }
            have_b: { type: integer }
            need: { type: integer }
        - type: object
          required: [kind, chi2, p_value, accept_rate_a, accept_rate_b]
          properties:
            kind: { const: inconclusive }
            chi2: { type: number }
            p_value: { type: number }
            accept_rate_a: { type: number }
            accept_rate_b: { type: number }
        - type: object
          required: [kind, chi2, p_value, accept_rate_a, accept_rate_b, winner_label, winner_version_id, loser_version_id]
          properties:
            kind: { const: significant }
            chi2: { type: number }
            p_value: { type: number }
            accept_rate_a: { type: number }
            accept_rate_b: { type: number }
            winner_label: { type: string, enum: [a, b] }
            winner_version_id: { type: string }
            loser_version_id: { type: string }

    EvalResponse:
      type: object
      required: [experiment_id, prompt_key, stats, verdict, options]
      properties:
        experiment_id: { type: string }
        prompt_key: { type: string }
        stats:
          type: object
          properties:
            invocations_a: { type: integer }
            invocations_b: { type: integer }
            accepted_a: { type: integer }
            accepted_b: { type: integer }
            rejected_a: { type: integer }
            rejected_b: { type: integer }
            ignored_a: { type: integer }
            ignored_b: { type: integer }
            total_outcomes_a: { type: integer }
            total_outcomes_b: { type: integer }
        verdict: { $ref: '#/components/schemas/EvalVerdict' }
        options: { $ref: '#/components/schemas/EvalOptions' }

    # ── Error envelope ──
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, request_id]
          properties:
            code:
              type: string
              enum:
                - INVALID_REQUEST
                - UNAUTHORIZED
                - FORBIDDEN
                - TENANT_NOT_FOUND
                - PROMPT_NOT_FOUND
                - BUDGET_EXCEEDED
                - QUOTA_EXCEEDED
                - RATE_LIMITED
                - EGRESS_FORBIDDEN
                - PROVIDER_UNAVAILABLE
                - PROVIDER_TIMEOUT
                - PROVIDER_NOT_CONFIGURED
                - MODEL_CAPABILITY_MISMATCH
                - MODEL_DEPRECATED
                - PII_PASS_THROUGH_NOT_CONSENTED
                - PII_PATTERN_INVALID
                - PII_UNREDACTABLE
                - INVOCATION_NOT_FOUND
                - INTERNAL
            message: { type: string }
            details:
              type: object
              additionalProperties: true
            request_id: { type: string }

    # ── Admin list responses ─────────────────────────────────────────
    AdminPromptListItem:
      type: object
      required: [key, module, feature, total_versions, updated_at]
      properties:
        key: { type: string }
        module: { type: string }
        feature: { type: string }
        description: { type: string, nullable: true }
        active_version_id: { type: string, nullable: true }
        total_versions: { type: integer, minimum: 0 }
        updated_at: { type: string, format: date-time }
        default_capability: { type: string, nullable: true }
        safety_class: { type: string, nullable: true, enum: [standard, restricted, null] }
    AdminPromptListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AdminPromptListItem' }
        note:
          type: string
          description: Present when the gateway DB is not configured; items will be empty.

    AdminExperimentListItem:
      type: object
      required: [id, prompt_key, status, traffic_split, variant_a_version_id, variant_b_version_id]
      properties:
        id: { type: string, format: uuid }
        prompt_key: { type: string }
        status:
          type: string
          enum: [active, evaluated, promoted, cancelled]
        traffic_split: { type: number, minimum: 0, maximum: 1 }
        variant_a_version_id: { type: string }
        variant_b_version_id: { type: string }
        started_at: { type: string, format: date-time, nullable: true }
        evaluated_at: { type: string, format: date-time, nullable: true }
        verdict: { type: string, nullable: true }
        sample_size: { type: integer, nullable: true }
        note: { type: string, nullable: true }
    AdminExperimentListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AdminExperimentListItem' }
        note: { type: string }

    AdminAuditListItem:
      type: object
      required: [id, ts, status]
      properties:
        id: { type: string, format: uuid }
        ts: { type: string, format: date-time }
        prompt_key: { type: string, nullable: true }
        version_id: { type: string, nullable: true }
        provider_kind: { $ref: '#/components/schemas/ProviderKind' }
        model_id: { type: string, nullable: true }
        status:
          type: string
          enum: [succeeded, failed, rejected_safety]
        error_code: { type: string, nullable: true }
        latency_ms: { type: integer, nullable: true }
        cost_usd: { type: number, nullable: true }
        tenant_id: { type: string, format: uuid, nullable: true }
        user_id: { type: string, format: uuid, nullable: true }
        experiment_id: { type: string, nullable: true }
        variant_label: { type: string, nullable: true }
    AdminAuditListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AdminAuditListItem' }
        note: { type: string }

    # ── Fine-tuning ──────────────────────────────────────────────────
    FineTuneStatus:
      type: string
      enum: [queued, preparing, training, succeeded, failed, cancelled]
    FineTuneDatasetFormat:
      type: string
      enum: [jsonl, parquet, csv]

    FineTuneCreateInput:
      type: object
      required: [tenant_id, provider_kind, base_model_id]
      properties:
        tenant_id: { type: string, format: uuid }
        provider_kind:
          type: string
          enum: [anthropic, openai, google_gemini, mistral]
        base_model_id: { type: string, maxLength: 256 }
        dataset_url:
          type: string
          description: |
            Either an OpenAI file id (file-…) or an https:// signed URL the
            gateway can fetch. gs:// / s3:// are rejected — use a signed URL.
        dataset_format: { $ref: '#/components/schemas/FineTuneDatasetFormat' }
        hyperparameters:
          type: object
          description: |
            Provider-specific. For OpenAI, only n_epochs / batch_size /
            learning_rate_multiplier are forwarded; unknown keys are dropped.
          additionalProperties: true
        created_by_user_id: { type: string, format: uuid }

    FineTuneJob:
      type: object
      required: [id, tenant_id, provider_kind, base_model_id, status, hyperparameters, result_metrics, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        provider_kind:
          type: string
          enum: [anthropic, openai, google_gemini, mistral]
        base_model_id: { type: string }
        fine_tuned_model_id: { type: string, nullable: true }
        provider_job_id: { type: string, nullable: true }
        dataset_url: { type: string, nullable: true }
        dataset_format: { $ref: '#/components/schemas/FineTuneDatasetFormat', nullable: true }
        hyperparameters:
          type: object
          additionalProperties: true
        status: { $ref: '#/components/schemas/FineTuneStatus' }
        status_message: { type: string, nullable: true }
        result_metrics:
          type: object
          additionalProperties: true
        created_by_user_id: { type: string, format: uuid, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        started_at: { type: string, format: date-time, nullable: true }
        finished_at: { type: string, format: date-time, nullable: true }
        cancelled_at: { type: string, format: date-time, nullable: true }
        cancel_reason: { type: string, nullable: true }

    FineTunePollTickResult:
      type: object
      required: [scanned, updated, unchanged, failed_lookup, skipped, errors]
      properties:
        scanned: { type: integer, minimum: 0 }
        updated: { type: integer, minimum: 0 }
        unchanged: { type: integer, minimum: 0 }
        failed_lookup:
          type: integer
          minimum: 0
          description: Jobs that were in-flight at list time but vanished before the patch landed.
        skipped:
          type: integer
          minimum: 0
          description: Jobs whose provider_kind has no fetcher registered (non-openai today).
        errors:
          type: array
          items:
            type: object
            required: [job_id, provider_kind, code, message]
            properties:
              job_id: { type: string, format: uuid }
              provider_kind: { type: string }
              code:
                type: string
                enum: [PROVIDER_NOT_CONFIGURED, PROVIDER_UNAVAILABLE, JOB_NOT_FOUND, UNKNOWN]
              message: { type: string }
