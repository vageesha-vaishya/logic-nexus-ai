[project]
name = "markets-worker"
version = "0.1.0"
description = "Logic Nexus AI — Markets domain Python worker (FastAPI + RQ + DuckDB + Polars + MCP)"
requires-python = ">=3.12"
dependencies = [
    # Web framework
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",

    # Validation + settings
    "pydantic>=2.7",
    "pydantic-settings>=2.5",

    # Supabase
    "supabase>=2.10",

    # LLM providers
    "anthropic>=0.40",
    "openai>=1.50",

    # Job queue (backed by Upstash Redis)
    "rq>=1.16",
    "redis>=5.0",

    # Analytics / backtesting
    "duckdb>=1.1",
    "polars>=1.9",
    "numpy>=2.0",

    # MCP server
    "mcp>=1.2",

    # HTTP client
    "httpx>=0.27",

    # Auth
    "python-jose[cryptography]>=3.3",

    # Structured logging
    "structlog>=24.4",

    # Date/time utilities
    "python-dateutil>=2.9",
]

[tool.uv]
dev-dependencies = [
    "ruff>=0.7",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-httpx>=0.32",
    "respx>=0.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/markets_worker"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
