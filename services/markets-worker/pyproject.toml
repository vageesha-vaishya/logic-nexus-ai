[project]
name = "markets-worker"
version = "0.1.0"
description = "Logic Nexus AI — Markets domain Python worker (FastAPI + RQ + DuckDB + Polars + MCP)"
requires-python = ">=3.12"
dependencies = [
    # Web framework
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    # Validation + settings
    "pydantic>=2.7",
    "pydantic-settings>=2.5",
    # Supabase
    "supabase>=2.10",
    # LLM providers
    "anthropic>=0.40",
    "openai>=1.50",
    # Job queue (backed by Upstash Redis)
    "rq>=1.16",
    "redis>=5.0",
    # Analytics / backtesting
    "duckdb>=1.1",
    "polars>=1.9",
    "numpy>=2.0",
    # MCP server
    "mcp>=1.2",
    # LangGraph — signal generation agent
    "langgraph>=0.2",
    "langchain-openai>=0.2",
    "langchain-anthropic>=0.2",
    # HTTP client
    "httpx>=0.27",
    # Auth
    "python-jose[cryptography]>=3.3",
    # Structured logging
    "structlog>=24.4",
    # Date/time utilities
    "python-dateutil>=2.9",
    "yfinance>=1.3.0",
    # ── Broker SDKs ──────────────────────────────────────────────────────────
    "breeze-connect>=1.0.0",       # ICICI Direct Breeze API
    "smartapi-python>=1.4.0",      # Angel One SmartAPI
    "pyotp>=2.9.0",                # TOTP for Angel One automated refresh
    "dhanhq>=2.0.0",               # Dhan HQ API
    "fyers-apiv3>=3.0.0",          # Fyers API v3
    "kiteconnect>=5.0.0",          # Zerodha Kite Connect
    # neo-api-client (Kotak Neo) is NOT on PyPI — Kotak adapter uses lazy import
    # ── Credential encryption ─────────────────────────────────────────────────
    "cryptography>=42.0.0",        # Fernet encryption for broker credentials
]

[dependency-groups]
dev = [
    "ruff>=0.7",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-httpx>=0.32",
    "respx>=0.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/markets_worker"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
