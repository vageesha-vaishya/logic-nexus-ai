# Gitleaks configuration
# https://github.com/gitleaks/gitleaks

title = "Logic Nexus AI - Gitleaks Config"

[extend]
# Use default rules as base
useDefault = true

[[rules]]
id = "supabase-service-role"
description = "Supabase service role key"
regex = '''eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9\.[A-Za-z0-9+/=]+\.[A-Za-z0-9+/=_-]+'''
tags = ["supabase", "jwt", "service-role"]

[[rules]]
id = "supabase-url"
description = "Supabase project URL with credentials"
regex = '''https://[a-z0-9]+\.supabase\.co'''
tags = ["supabase", "url"]
[rules.allowlist]
  # Allow in .env.example, docs, README, and Supabase migration files
  # (pg_cron jobs etc. legitimately embed the project URL of the DB
  # they run on; the URL is public and not a credential). Operational
  # risk: cloning the schema to a new project requires rewriting the
  # URL in the new project's migrations — accept this tradeoff vs.
  # diverging local files from prod truth.
  paths = ['''.env\.example''', '''docs/.*''', '''README.*''', '''supabase/migrations/.*\.sql''']

[allowlist]
  description = "Global allowlist"
  paths = [
    '''.env\.example''',
    '''docs/incidents/.*''',
    '''\.gitleaks\.toml''',
    # google-services.json is the PUBLIC Firebase Android config — the
    # AIzaSy* API key inside is meant to ship in published APKs; security
    # is enforced via SHA-1 + package-name binding on Firebase's side, not
    # by key secrecy. See https://firebase.google.com/docs/projects/api-keys
    '''android/app/google-services.json''',
    '''ios/.*/GoogleService-Info\.plist''',
  ]
  # Allow placeholder values in example files
  regexes = [
    '''your-.*-key''',
    '''your-project-id''',
    '''sb_publishable_xxx''',
    '''YOUR_PASSWORD''',
  ]
