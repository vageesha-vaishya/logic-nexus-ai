;; PgBouncer module pool template
;; Apply one [database] entry per module with isolated users and pool tuning.

[databases]
module_crm = host=crm-db.internal port=5432 dbname=logicnexus user=module_crm_rw pool_size=100 pool_mode=transaction
module_amro = host=amro-db.internal port=5432 dbname=logicnexus user=module_amro_rw pool_size=100 pool_mode=transaction
module_finance = host=finance-db.internal port=5432 dbname=logicnexus user=module_finance_rw pool_size=100 pool_mode=transaction

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = cert
auth_file = /etc/pgbouncer/userlist.txt
client_tls_sslmode = verify-full
server_tls_sslmode = verify-full
query_timeout = 30
server_idle_timeout = 30
max_client_conn = 5000
ignore_startup_parameters = extra_float_digits
