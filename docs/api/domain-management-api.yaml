openapi: 3.1.0
info:
  title: Domain Management API
  version: 1.0.0
  description: Bulk domain assignment, revocation, and audit history endpoints.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    AssignmentPayload:
      type: object
      required: [domainId, tenantIds]
      properties:
        domainId:
          type: string
        tenantIds:
          type: array
          items:
            type: string
        batchId:
          type: string
    AssignmentResult:
      type: object
      properties:
        batchId:
          type: string
        domainId:
          type: string
        attempted:
          type: integer
        assigned:
          type: integer
        reactivated:
          type: integer
        skipped:
          type: integer
    RevokeResult:
      type: object
      properties:
        batchId:
          type: string
        domainId:
          type: string
        attempted:
          type: integer
        revoked:
          type: integer
        skipped:
          type: integer
    AuditLog:
      type: object
      properties:
        id:
          type: string
        action:
          type: string
        tenant_id:
          type: [string, 'null']
        domain_id:
          type: [string, 'null']
        actor_user_id:
          type: [string, 'null']
        batch_id:
          type: [string, 'null']
        metadata:
          type: object
        created_at:
          type: string
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        correlationId:
          type: string
paths:
  /domain-assignments:
    get:
      summary: List domain assignment audit history
      parameters:
        - in: query
          name: tenant_id
          schema:
            type: string
        - in: query
          name: domain_id
          schema:
            type: string
        - in: query
          name: batch_id
          schema:
            type: string
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 200
      responses:
        '200':
          description: Audit history list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AuditLog'
                  correlationId:
                    type: string
                  version:
                    type: string
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      summary: Bulk assign domain to tenants
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignmentPayload'
      responses:
        '200':
          description: Assignment summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/AssignmentResult'
                  correlationId:
                    type: string
                  version:
                    type: string
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      summary: Bulk revoke domain from tenants
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignmentPayload'
      responses:
        '200':
          description: Revocation summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/RevokeResult'
                  correlationId:
                    type: string
                  version:
                    type: string
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
