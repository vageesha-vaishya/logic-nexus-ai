<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AMRO Parts Navigation Prototype</title>
  <style>
    :root { --bg:#f8fafc; --card:#ffffff; --muted:#64748b; --line:#dbe1ea; --primary:#0f766e; --active:#ccfbf1; }
    body { margin:0; font-family:Inter, Arial, sans-serif; background:var(--bg); color:#0f172a; }
    .wrap { max-width:1200px; margin:20px auto; padding:0 12px; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px; }
    .top { display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; }
    .crumb { font-size:12px; color:var(--muted); }
    .chip { border:1px solid var(--line); background:#fff; border-radius:999px; padding:5px 10px; font-size:12px; cursor:pointer; }
    .chip.active { background:#111827; color:#fff; border-color:#111827; }
    .grid { margin-top:12px; display:grid; grid-template-columns:280px 1fr; gap:12px; }
    .menu button { width:100%; text-align:left; border:1px solid var(--line); border-radius:8px; background:#fff; margin-bottom:8px; padding:9px; cursor:pointer; }
    .menu button.active { border-color:var(--primary); background:var(--active); }
    .group { margin:4px 0 10px; font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; }
    .surface { min-height:420px; }
    .badge { font-size:11px; border:1px solid var(--line); border-radius:999px; padding:4px 8px; }
    @media (max-width: 900px) { .grid { grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="top">
        <div>
          <div><strong>AMRO Parts Navigation Prototype</strong></div>
          <div id="crumb" class="crumb">AMRO > Parts Inventory > Overview</div>
        </div>
        <div class="badge">Nav Response: <span id="latency">0</span>ms</div>
      </div>
      <div id="shortcuts" style="margin-top:10px; display:flex; flex-wrap:wrap; gap:8px;"></div>
    </div>
    <div class="grid">
      <div class="card menu" id="menu"></div>
      <div class="card surface">
        <h3 id="title" style="margin-top:0"></h3>
        <p id="desc" style="color:var(--muted)"></p>
      </div>
    </div>
  </div>
  <script>
    const modules = [
      { id:'overview', label:'Overview', group:'Inventory Core', desc:'Primary inventory workspace.' },
      { id:'item-master', label:'Item Master', group:'Inventory Core', desc:'Canonical part definitions.' },
      { id:'stock-ledger', label:'Stock Ledger', group:'Inventory Core', desc:'Movement and valuation records.' },
      { id:'reservations', label:'Reservations', group:'Operations', desc:'Reserved stock commitments.' },
      { id:'issue-consume', label:'Issue & Consume', group:'Operations', desc:'Operational issue queue.' },
      { id:'restock', label:'Restock', group:'Operations', desc:'Replenishment priorities.' },
      { id:'locations', label:'Locations', group:'Operations', desc:'Warehouse/bin distribution.' },
      { id:'analytics', label:'Analytics', group:'Insights', desc:'KPI and trend summaries.' }
    ];
    let active = 'overview';
    function render() {
      const menu = document.getElementById('menu');
      const shortcuts = document.getElementById('shortcuts');
      const title = document.getElementById('title');
      const desc = document.getElementById('desc');
      const crumb = document.getElementById('crumb');
      const groups = [...new Set(modules.map(m => m.group))];
      menu.innerHTML = groups.map(group => {
        const entries = modules.filter(m => m.group === group).map(m =>
          `<button class="${m.id===active?'active':''}" onclick="activate('${m.id}')">${m.label}</button>`
        ).join('');
        return `<div class="group">${group}</div>${entries}`;
      }).join('');
      shortcuts.innerHTML = modules.slice(0,4).map(m =>
        `<button class="chip ${m.id===active?'active':''}" onclick="activate('${m.id}')">${m.label}</button>`
      ).join('');
      const current = modules.find(m => m.id === active);
      title.textContent = current.label;
      desc.textContent = current.desc;
      crumb.textContent = `AMRO > Parts Inventory > ${current.label}`;
    }
    function activate(id) {
      const t0 = performance.now();
      active = id;
      requestAnimationFrame(() => {
        document.getElementById('latency').textContent = Math.round(performance.now() - t0);
      });
      render();
    }
    render();
  </script>
</body>
</html>
