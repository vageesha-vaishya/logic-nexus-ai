# /etc/nginx/sites-available/logic-nexus.conf
#
# Replace `retail.your-domain.com` with your actual host before reloading.
# Certbot --nginx will fill in the ssl_* lines on first run.

# ── HTTP → HTTPS redirect ─────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name retail.your-domain.com;

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── Main HTTPS server ─────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name retail.your-domain.com;

    # certbot --nginx will inject ssl_certificate / ssl_certificate_key lines here.
    # Modern TLS defaults:
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Cap upload size (we don't accept large uploads anywhere)
    client_max_body_size 4m;

    # ── Static SPA (Vite build) ──────────────────────────────────────────────
    root /srv/logic-nexus/dist;
    index index.html;

    # Vite hashes assets; cache aggressively.
    location /assets/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback — every non-asset path returns index.html so React Router
    # can take over.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Reverse proxy to markets-worker ──────────────────────────────────────
    location /api/markets-worker/ {
        # Strip the prefix before forwarding to the worker.
        rewrite ^/api/markets-worker/(.*)$ /$1 break;

        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;

        # Standard reverse-proxy headers
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # WebSocket upgrade (worker uses /ws_ticks if Realtime is wired)
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        # LLM streaming responses can take a while — generous timeouts.
        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;

        # Don't buffer streaming responses
        proxy_buffering off;
    }

    # ── Optional: Supabase MCP / functions proxy ────────────────────────────
    # If you ever proxy other workers (uim-api, amro-api, crm-api), add their
    # location blocks here with the same shape as the markets-worker one above.

    # ── Robots / favicon noise ───────────────────────────────────────────────
    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }
}
