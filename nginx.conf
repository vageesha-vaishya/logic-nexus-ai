server {
    listen 4173;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # ── Gzip ─────────────────────────────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript
               image/svg+xml application/wasm;

    # ── Security headers ─────────────────────────────────────────────────────

    # Prevent MIME sniffing attacks
    add_header X-Content-Type-Options "nosniff" always;

    # Disallow framing entirely — no clickjacking surface
    add_header X-Frame-Options "DENY" always;

    # Don't expose full URL to cross-origin requests
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # HSTS — 2 years, include subdomains, submit to preload list
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # Restrict browser feature access — fine-grained API opt-in
    add_header Permissions-Policy
        "geolocation=(), camera=(), microphone=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=()"
        always;

    # Prevent cross-origin window handle leakage (Spectre mitigation)
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # Prevent cross-origin reads of our resources from other origins
    add_header Cross-Origin-Resource-Policy "same-site" always;

    # CSP — tightened from original:
    #   • removed 'unsafe-eval'  (Vite prod builds do not require it)
    #   • kept 'unsafe-inline'   (Vite module-preload polyfill emits an inline script;
    #                             remove once moved to a nonce-based approach)
    #   • connect-src: scoped to Supabase subdomain instead of blanket https:
    #   • added upgrade-insecure-requests
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data: https:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://api.anthropic.com https://api.openai.com https://generativelanguage.googleapis.com; frame-src 'self' https://challenges.cloudflare.com; worker-src 'self' blob:; base-uri 'self'; form-action 'self'; object-src 'none'; frame-ancestors 'none'; upgrade-insecure-requests" always;

    # ── Routes ───────────────────────────────────────────────────────────────

    location / {
        add_header Cache-Control "no-store" always;
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        try_files $uri =404;
    }

    # Immutable static assets (content-hashed filenames from Vite build)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable, no-transform" always;
    }

    # ── Upstream proxies ─────────────────────────────────────────────────────

    location /api/v2/amro/ {
        proxy_pass http://${AMRO_API_UPSTREAM};
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    location /api/amro/ {
        proxy_pass http://${AMRO_API_UPSTREAM}/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    # Markets worker (FastAPI on the VPS host at 127.0.0.1:8001).
    # The trailing slash on proxy_pass strips the /api/markets prefix, so
    # browser request /api/markets/v1/retail/signals → upstream /v1/retail/signals.
    location /api/markets/ {
        proxy_pass http://${MARKETS_API_UPSTREAM}/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }

    # ── Health check ─────────────────────────────────────────────────────────
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type "text/plain" always;
    }
}
